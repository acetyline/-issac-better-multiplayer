name: Build and release Better Multiplayer Friends

on:
  push:
    tags:
      - v0.4.0

permissions:
  contents: write

concurrency:
  group: better-multiplayer-friends-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Zig 0.15.2
        run: |
          $folder = 'zig-x86_64-windows-0.15.2'
          $archive = Join-Path $env:RUNNER_TEMP "$folder.zip"
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.15.2/$folder.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $zig = Join-Path $env:RUNNER_TEMP "$folder/zig.exe"
          if ((& $zig version) -ne '0.15.2') { throw 'Expected Zig 0.15.2.' }
          "ZIG_PATH=$zig" >> $env:GITHUB_ENV

      - name: Build the friends installer
        run: |
          [string] $setup = & .\Build-FriendsSetup.ps1 -ZigPath $env:ZIG_PATH
          $asset = Get-Item -LiteralPath $setup
          "SETUP_EXE=$($asset.FullName)" >> $env:GITHUB_ENV

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
            throw 'The release tag must point to the commit built by this run.'
          }

          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = "支持 Windows Steam 版 Repentance+ 1.9.7.19.J511 和 1.9.7.20.J514。包含好友房、公开房、Mod 同步和独立的 EXE 安装与启动流程。[构建记录]($runUrl)"

          gh release view $tag --json databaseId *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:SETUP_EXE --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --notes $notes
          } else {
            gh release create $tag $env:SETUP_EXE --verify-tag --prerelease `
              --title "Better Multiplayer $($tag.TrimStart('v')) 预览版" --notes $notes
          }
